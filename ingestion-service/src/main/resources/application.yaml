server:
  port: 8082

spring:
  kafka:
    bootstrap-servers: localhost:9094
    template:
      default-topic: energy-usage
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Note the updated property name below: value-serializer-class
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  application:
    name: ingestion-service

simulation:
  ingestion-endpoint: http://127.0.0.1:8082/api/v1/ingestion
  requests-per-interval: 1000
  interval-ms: 50000
  parallel-threads: 10
